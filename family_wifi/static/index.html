<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family WiFi</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --accent:#0a84ff; --line:#d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:#38383a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:17px -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); padding:16px; padding-top:max(16px, env(safe-area-inset-top)); }
  h1 { font-size:28px; margin:8px 0 16px; }
  h2 { font-size:13px; text-transform:uppercase; color:var(--muted); font-weight:600; margin:20px 4px 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:10px 14px; font-size:16px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.go { width:100%; margin-top:24px; padding:16px; font-size:18px; font-weight:600; border:0; border-radius:14px; background:var(--accent); color:#fff; }
  pre { white-space:pre-wrap; background:var(--card); border-radius:14px; padding:14px; font:15px -apple-system, system-ui, sans-serif; }
  .hide { display:none; }
  input { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
</style>
</head>
<body>
<h1>Family WiFi</h1>
<div id="login" class="hide">
  <h2>Access token</h2>
  <input id="token" type="password" placeholder="api_token from config.yaml">
  <button class="go" onclick="saveToken()">Save</button>
</div>
<div id="main" class="hide">
  <h2>What</h2><div class="chips" id="actions"></div>
  <div id="whoBox"><h2>Who</h2><div class="chips" id="targets"></div></div>
  <div id="speedBox" class="hide"><h2>Speed</h2><div class="chips" id="speeds"></div></div>
  <div id="sitesBox" class="hide"><h2>Websites</h2><div class="chips" id="site_lists"></div></div>
  <div id="durBox"><h2>How long</h2><div class="chips" id="durations"></div></div>
  <button class="go" onclick="go()">Do it</button>
  <h2>Now</h2><pre id="out">…</pre>
</div>
<script>
const pick = {};
let token = "";
try { token = localStorage.getItem("fw_token") || ""; } catch (e) {}
function saveToken() {
  token = document.getElementById("token").value.trim();
  try { localStorage.setItem("fw_token", token); } catch (e) {}
  start();
}
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { show(false); throw new Error("token"); }
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function chips(id, items) {
  const el = document.getElementById(id); el.innerHTML = "";
  items.forEach((t, i) => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = () => { pick[id] = t; [...el.children].forEach(c => c.classList.toggle("on", c === b)); refresh(); };
    el.appendChild(b);
    if (i === 0) b.click();
  });
}
function refresh() {
  const a = pick.actions || "";
  document.getElementById("speedBox").classList.toggle("hide", !a.includes("Slow"));
  document.getElementById("sitesBox").classList.toggle("hide", !a.includes("websites"));
  document.getElementById("durBox").classList.toggle("hide", a.includes("Restore") || a.includes("Status"));
  document.getElementById("whoBox").classList.toggle("hide", a.includes("Status"));
}
function show(main) {
  document.getElementById("main").classList.toggle("hide", !main);
  document.getElementById("login").classList.toggle("hide", main);
}
async function status() { document.getElementById("out").textContent = (await api("/status")).message; }
async function go() {
  const a = pick.actions;
  const option = a.includes("Slow") ? pick.speeds : a.includes("websites") ? pick.site_lists : null;
  try {
    const r = await api("/do", { action: a, target: pick.targets, duration: pick.durations, option });
    document.getElementById("out").textContent = r.message;
    if (!a.includes("Status")) setTimeout(status, 1500);
  } catch (e) { document.getElementById("out").textContent = "⚠️ " + e.message; }
}
async function start() {
  if (!token) return show(false);
  try {
    const m = await api("/menu"); show(true);
    for (const k of ["actions", "targets", "speeds", "site_lists", "durations"]) chips(k, m[k]);
    status();
  } catch (e) { if (e.message !== "token") document.body.insertAdjacentHTML("beforeend", "<pre>⚠️ " + e.message + "</pre>"); }
}
start();
</script>
</body>
</html>

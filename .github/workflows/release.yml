name: Release

# When the integration's version in manifest.json changes on main, publish a
# GitHub release (e.g. v0.3.0). HACS uses releases to offer updates, which then
# show in Home Assistant under Settings → Updates with these release notes.

on:
  push:
    branches: [main]
    paths: [custom_components/family_wifi/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/family_wifi/manifest.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released"
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "Family WiFi v$version" --generate-notes
